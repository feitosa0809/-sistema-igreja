<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Dízimos - Igreja</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Igreja App">
    <meta name="msapplication-TileColor" content="#007bff">
    <meta name="msapplication-tap-highlight" content="no">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- PWA Icons -->
    <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/icon-152x152.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16x16.png">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading" class="loading">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Carregando...</span>
        </div>
        <p class="mt-3">Carregando aplicação...</p>
    </div>

    <!-- Login Form -->
    <div id="loginForm" style="display: none;">
        <div class="container">
            <div class="login-container">
                <div class="card shadow">
                    <div class="card-header text-center">
                        <h4><i class="fas fa-church"></i> Sistema de Dízimos</h4>
                    </div>
                    <div class="card-body">
                        <form id="loginFormElement">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-sign-in-alt"></i> Entrar
                            </button>
                        </form>
                        <hr>
                        <button class="btn btn-outline-secondary w-100" onclick="showRegisterForm()">
                            <i class="fas fa-user-plus"></i> Criar Conta
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Register Form -->
    <div id="registerForm" style="display: none;">
        <div class="container">
            <div class="login-container">
                <div class="card shadow">
                    <div class="card-header text-center">
                        <h4><i class="fas fa-user-plus"></i> Criar Conta</h4>
                    </div>
                    <div class="card-body">
                        <form id="registerFormElement">
                            <div class="mb-3">
                                <label for="regNome" class="form-label">Nome Completo</label>
                                <input type="text" class="form-control" id="regNome" required>
                            </div>
                            <div class="mb-3">
                                <label for="regEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="regEmail" required>
                            </div>
                            <div class="mb-3">
                                <label for="regTelefone" class="form-label">Telefone</label>
                                <input type="tel" class="form-control" id="regTelefone">
                            </div>
                            <div class="mb-3">
                                <label for="regDataNascimento" class="form-label">Data de Nascimento</label>
                                <input type="date" class="form-control" id="regDataNascimento">
                            </div>
                            <div class="mb-3">
                                <label for="regEndereco" class="form-label">Endereço</label>
                                <textarea class="form-control" id="regEndereco" rows="2"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="regPassword" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="regPassword" required minlength="6">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-user-plus"></i> Cadastrar
                            </button>
                        </form>
                        <hr>
                        <button class="btn btn-outline-secondary w-100" onclick="showLoginForm()">
                            <i class="fas fa-arrow-left"></i> Voltar ao Login
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" style="display: none;">
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="#"><i class="fas fa-church"></i> Sistema de Dízimos</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="showDashboard()">
                                <i class="fas fa-tachometer-alt"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="showDizimos()">
                                <i class="fas fa-hand-holding-heart"></i> Dízimos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="showOfertas()">
                                <i class="fas fa-gift"></i> Ofertas
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="showCampanhas()">
                                <i class="fas fa-bullhorn"></i> Campanhas
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="aniversariantes.html">
                                <i class="fas fa-birthday-cake"></i> Aniversariantes
                            </a>
                        </li>
                        <li class="nav-item" id="adminMenu" style="display: none;">
                            <a class="nav-link" href="#" onclick="showAdmin()">
                                <i class="fas fa-cog"></i> Administração
                            </a>
                        </li>
                    </ul>
                    <ul class="navbar-nav">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" data-bs-toggle="dropdown">
                                <i class="fas fa-user"></i> <span id="userName"></span>
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#" onclick="showProfile()">
                                    <i class="fas fa-user-edit"></i> Perfil
                                </a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#" onclick="logout()">
                                    <i class="fas fa-sign-out-alt"></i> Sair
                                </a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container mt-4">
            <div id="content">
                <!-- Content will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="modals-container">
        <!-- Modals will be loaded here -->
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
    <!-- Debug script -->
    <script>
        console.log('Page loaded, initializing...');
        
        // Show login form immediately for testing
        setTimeout(() => {
            const loading = document.getElementById('loading');
            const loginForm = document.getElementById('loginForm');
            if (loading) loading.style.display = 'none';
            if (loginForm) loginForm.style.display = 'block';
        }, 100);
    </script>
    
    <script src="assets/js/config.js" onerror="console.error('Failed to load config.js')"></script>
    <script src="assets/js/api.js" onerror="console.error('Failed to load api.js')"></script>
    <script src="assets/js/auth.js" onerror="console.error('Failed to load auth.js')"></script>
    <script src="assets/js/dashboard.js" onerror="console.error('Failed to load dashboard.js')"></script>
    <script src="assets/js/donations.js" onerror="console.error('Failed to load donations.js')"></script>
    <script src="assets/js/modals.js" onerror="console.error('Failed to load modals.js')"></script>
    <script src="assets/js/app.js" onerror="console.error('Failed to load app.js')"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('Service Worker registrado com sucesso:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('Falha ao registrar Service Worker:', error);
                    });
            });
        }
        
        // PWA Install Prompt
        let deferredPrompt;
        const installButton = document.createElement('button');
        installButton.innerHTML = '<i class="fas fa-download"></i> Instalar App';
        installButton.className = 'btn btn-primary btn-sm position-fixed';
        installButton.style.cssText = 'bottom: 20px; right: 20px; z-index: 1000; display: none;';
        document.body.appendChild(installButton);

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installButton.style.display = 'block';

            installButton.addEventListener('click', () => {
                installButton.style.display = 'none';
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('Usuário aceitou instalar o PWA');
                    } else {
                        console.log('Usuário rejeitou instalar o PWA');
                    }
                    deferredPrompt = null;
                });
            });
        });

        // Hide install button if already installed
        window.addEventListener('appinstalled', (evt) => {
            console.log('PWA foi instalado com sucesso');
            installButton.style.display = 'none';
        });
    </script>
</body>
</html>
