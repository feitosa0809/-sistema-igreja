<!DOCTYPE html>
<html>
<head>
    <title>Teste Aniversariantes</title>
</head>
<body>
    <h1>Teste de Aniversariantes</h1>
    <div id="resultado"></div>
    <div id="logs"></div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        const resultadoDiv = document.getElementById('resultado');
        const logsDiv = document.getElementById('logs');

        function log(msg) {
            console.log(msg);
            logsDiv.innerHTML += `<p>${msg}</p>`;
        }

        async function testar() {
            try {
                // 1. Fazer login
                log('1. Fazendo login...');
                const loginRes = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@igreja.com',
                        senha: '123456'
                    })
                });
                
                const loginData = await loginRes.json();
                const token = loginData.token;
                log(`✅ Login OK, token: ${token.substring(0, 20)}...`);

                // 2. Buscar aniversariantes de dezembro
                log('<br>2. Buscando aniversariantes de dezembro...');
                const response = await fetch(`${API_URL}/birthdays/month/12`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                log(`Status da resposta: ${response.status}`);
                
                const data = await response.json();
                log(`Total encontrado: ${data.total}`);
                
                resultadoDiv.innerHTML = '<h2>Aniversariantes de Dezembro:</h2>';
                data.aniversariantes.forEach(person => {
                    resultadoDiv.innerHTML += `
                        <div style="border: 1px solid #ccc; padding: 10px; margin: 5px;">
                            <h3>${person.nome}</h3>
                            <p>Dia: ${person.dia}/12</p>
                            <p>Idade: ${person.idade} anos</p>
                            <p>Email: ${person.email}</p>
                        </div>
                    `;
                });
                
                log('<br>✅ Teste concluído com sucesso!');
                
            } catch (error) {
                log(`<br>❌ ERRO: ${error.message}`);
                console.error(error);
            }
        }

        testar();
    </script>
</body>
</html>
