<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dízimo Mobile - Igreja</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .mobile-container {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding: 20px 15px;
        }
        .header h3 {
            margin: 0;
            font-size: 1.5rem;
        }
        .content {
            padding: 20px 15px;
        }
        .form-control, .btn {
            border-radius: 15px;
            border: 2px solid #e0e0e0;
            padding: 15px;
            font-size: 16px;
        }
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            color: white;
            font-weight: bold;
        }
        .btn-primary:hover {
            background: linear-gradient(45deg, #5a6fd8, #6a4190);
        }
        .alert {
            border-radius: 15px;
            margin-top: 20px;
        }
        .nav-tabs {
            border: none;
        }
        .nav-tabs .nav-link {
            border: none;
            background: #f8f9fa;
            color: #667eea;
            margin: 0 5px;
            border-radius: 15px;
        }
        .nav-tabs .nav-link.active {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }
        .tab-content {
            margin-top: 20px;
        }
        .status-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="header">
            <h3><i class="fas fa-church"></i> Sistema de Dízimos</h3>
            <p class="mb-0">Versão Mobile</p>
        </div>
        
        <div class="content">
            <!-- Status dos Serviços -->
            <div class="status-card">
                <h6><i class="fas fa-server"></i> Status dos Serviços</h6>
                <div id="serviceStatus">
                    <span class="badge bg-warning">Verificando...</span>
                </div>
            </div>

            <!-- Navegação -->
            <ul class="nav nav-tabs" id="mobileTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">Login</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">Cadastro</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="test-tab" data-bs-toggle="tab" data-bs-target="#test" type="button">Teste API</button>
                </li>
            </ul>

            <div class="tab-content" id="mobileTabContent">
                <!-- Login Tab -->
                <div class="tab-pane fade show active" id="login" role="tabpanel">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">📧 Email</label>
                            <input type="email" class="form-control" id="loginEmail" value="joao@teste.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">🔒 Senha</label>
                            <input type="password" class="form-control" id="loginPassword" value="123456" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-sign-in-alt"></i> Entrar
                        </button>
                    </form>
                </div>

                <!-- Cadastro Tab -->
                <div class="tab-pane fade" id="register" role="tabpanel">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">👤 Nome</label>
                            <input type="text" class="form-control" id="regNome" value="Maria Mobile" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">📧 Email</label>
                            <input type="email" class="form-control" id="regEmail" value="maria@mobile.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">📱 Telefone</label>
                            <input type="tel" class="form-control" id="regTelefone" value="11987654321">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">🏠 Endereço</label>
                            <input type="text" class="form-control" id="regEndereco" value="Rua Mobile, 123">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">🔒 Senha</label>
                            <input type="password" class="form-control" id="regPassword" value="123456" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-user-plus"></i> Cadastrar
                        </button>
                    </form>
                </div>

                <!-- Teste API Tab -->
                <div class="tab-pane fade" id="test" role="tabpanel">
                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-primary" onclick="testarAPI()">
                            <i class="fas fa-heartbeat"></i> Testar Conexão
                        </button>
                        <button class="btn btn-outline-success" onclick="testarCadastroRapido()">
                            <i class="fas fa-rocket"></i> Teste Rápido
                        </button>
                    </div>
                </div>
            </div>

            <!-- Resultado -->
            <div id="resultado" class="alert" style="display: none;"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const API_BASE = 'http://192.168.4.12:3000/api';
        
        // Verificar status dos serviços ao carregar
        window.addEventListener('load', verificarStatus);

        async function verificarStatus() {
            const statusDiv = document.getElementById('serviceStatus');
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    statusDiv.innerHTML = '<span class="badge bg-success">✅ Online</span>';
                } else {
                    statusDiv.innerHTML = '<span class="badge bg-danger">❌ Offline</span>';
                }
            } catch (error) {
                statusDiv.innerHTML = '<span class="badge bg-danger">❌ Erro de Conexão</span>';
            }
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            mostrarResultado('Fazendo login...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        senha: document.getElementById('loginPassword').value
                    })
                });
                
                const data = await response.json();
                if (response.ok) {
                    mostrarResultado(`✅ Login realizado! Bem-vindo, ${data.user.nome}!`, 'success');
                } else {
                    mostrarResultado(`❌ Erro: ${data.error}`, 'danger');
                }
            } catch (error) {
                mostrarResultado(`❌ Erro de conexão: ${error.message}`, 'danger');
            }
        });

        // Cadastro
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            mostrarResultado('Cadastrando usuário...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome: document.getElementById('regNome').value,
                        email: document.getElementById('regEmail').value,
                        telefone: document.getElementById('regTelefone').value,
                        endereco: document.getElementById('regEndereco').value,
                        senha: document.getElementById('regPassword').value
                    })
                });
                
                const data = await response.json();
                if (response.ok) {
                    mostrarResultado(`✅ Cadastro realizado! ID: ${data.user.id}`, 'success');
                } else {
                    mostrarResultado(`❌ Erro: ${data.error}`, 'danger');
                }
            } catch (error) {
                mostrarResultado(`❌ Erro de conexão: ${error.message}`, 'danger');
            }
        });

        async function testarAPI() {
            mostrarResultado('Testando API...', 'info');
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                mostrarResultado(`✅ API funcionando! Uptime: ${data.uptime}s`, 'success');
            } catch (error) {
                mostrarResultado(`❌ API offline: ${error.message}`, 'danger');
            }
        }

        async function testarCadastroRapido() {
            const randomId = Math.floor(Math.random() * 1000);
            mostrarResultado('Criando usuário de teste...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome: `Usuário Mobile ${randomId}`,
                        email: `mobile${randomId}@teste.com`,
                        telefone: `119${randomId}0000`,
                        endereco: `Rua Mobile ${randomId}`,
                        senha: '123456'
                    })
                });
                
                const data = await response.json();
                if (response.ok) {
                    mostrarResultado(`✅ Usuário criado! Email: mobile${randomId}@teste.com`, 'success');
                } else {
                    mostrarResultado(`❌ Erro: ${data.error}`, 'danger');
                }
            } catch (error) {
                mostrarResultado(`❌ Erro: ${error.message}`, 'danger');
            }
        }

        function mostrarResultado(mensagem, tipo) {
            const div = document.getElementById('resultado');
            div.className = `alert alert-${tipo}`;
            div.innerHTML = mensagem;
            div.style.display = 'block';
            
            // Auto-hide info messages
            if (tipo === 'info') {
                setTimeout(() => {
                    div.style.display = 'none';
                }, 3000);
            }
        }
    </script>
</body>
</html>
