<!DOCTYPE html>
<html>
<head>
    <title>Debug Aniversariantes</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .log { background: #f0f0f0; padding: 10px; margin: 5px 0; border-left: 3px solid #333; }
        .error { border-color: red; background: #ffe0e0; }
        .success { border-color: green; background: #e0ffe0; }
        .info { border-color: blue; background: #e0e0ff; }
    </style>
</head>
<body>
    <h1>🔍 Debug - Aniversariantes</h1>
    <div id="logs"></div>

    <script>
        const logsDiv = document.getElementById('logs');

        function log(msg, type = 'info') {
            console.log(msg);
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${msg}`;
            logsDiv.appendChild(div);
        }

        async function testarCompleto() {
            try {
                // 1. Verificar localStorage
                log('1️⃣ Verificando localStorage...', 'info');
                const authToken = localStorage.getItem('authToken');
                const token = localStorage.getItem('token');
                
                log(`authToken: ${authToken ? authToken.substring(0, 30) + '...' : 'NÃO ENCONTRADO'}`, authToken ? 'success' : 'error');
                log(`token: ${token ? token.substring(0, 30) + '...' : 'NÃO ENCONTRADO'}`, token ? 'success' : 'error');

                if (!authToken) {
                    log('❌ Token não encontrado! Fazendo login...', 'error');
                    
                    // Fazer login
                    const loginRes = await fetch('http://localhost:3000/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: 'admin@igreja.com',
                            senha: '123456'
                        })
                    });
                    
                    const loginData = await loginRes.json();
                    log(`✅ Login realizado! Token: ${loginData.token.substring(0, 30)}...`, 'success');
                    localStorage.setItem('authToken', loginData.token);
                    
                    // Recarregar para usar o token
                    log('🔄 Token salvo! Recarregando em 2 segundos...', 'info');
                    setTimeout(() => location.reload(), 2000);
                    return;
                }

                // 2. Testar API
                log('2️⃣ Testando API com token...', 'info');
                const response = await fetch('http://localhost:3000/api/birthdays/month/12', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                log(`Status da resposta: ${response.status}`, response.ok ? 'success' : 'error');

                if (!response.ok) {
                    const errorText = await response.text();
                    log(`❌ Erro na API: ${errorText}`, 'error');
                    return;
                }

                const data = await response.json();
                log(`✅ API retornou ${data.total} aniversariantes`, 'success');

                // 3. Mostrar resultados
                log('3️⃣ Aniversariantes de Dezembro:', 'info');
                data.aniversariantes.forEach(person => {
                    log(`🎂 ${person.nome} - Dia ${person.dia}/12 - ${person.idade} anos`, 'success');
                });

                // 4. Criar HTML
                const html = `
                    <div style="margin-top: 20px; padding: 20px; background: white; border: 2px solid green;">
                        <h2>✅ SUCESSO! Aniversariantes de Dezembro:</h2>
                        ${data.aniversariantes.map(p => `
                            <div style="padding: 10px; margin: 5px; background: #f9f9f9; border-left: 4px solid #667eea;">
                                <strong>${p.nome}</strong> - ${p.dia}/12 - ${p.idade} anos
                            </div>
                        `).join('')}
                        <hr>
                        <button onclick="window.location.href='aniversariantes.html'" style="padding: 10px 20px; background: #667eea; color: white; border: none; cursor: pointer;">
                            Ir para página de Aniversariantes
                        </button>
                    </div>
                `;
                logsDiv.innerHTML += html;

            } catch (error) {
                log(`❌ ERRO FATAL: ${error.message}`, 'error');
                console.error(error);
            }
        }

        // Executar
        testarCompleto();
    </script>
</body>
</html>
