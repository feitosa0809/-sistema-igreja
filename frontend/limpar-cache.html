<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpar Cache - Sistema Igreja</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .success {
            color: green;
            font-size: 24px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Limpar Cache do Sistema</h1>
        <p>Clique no botão abaixo para limpar o cache e corrigir problemas de login:</p>
        
        <button class="btn" onclick="clearCache()">
            🗑️ Limpar Cache e Recarregar
        </button>
        
        <div class="success" id="success">
            ✅ Cache limpo com sucesso!<br>
            Redirecionando...
        </div>
    </div>

    <script>
        function clearCache() {
            // Limpar localStorage
            localStorage.clear();
            
            // Limpar sessionStorage
            sessionStorage.clear();
            
            // Limpar cookies
            document.cookie.split(";").forEach(function(c) { 
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
            });
            
            // Mostrar mensagem de sucesso
            document.getElementById('success').style.display = 'block';
            
            // Redirecionar após 2 segundos
            setTimeout(function() {
                window.location.href = 'index.html';
            }, 2000);
        }
        
        // Verificar se foi passado parâmetro para limpar automaticamente
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('auto') === 'true') {
            clearCache();
        }
    </script>
</body>
</html>
