<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Dízimos - Igreja</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading" class="loading">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Carregando...</span>
        </div>
        <p class="mt-3">Carregando aplicação...</p>
    </div>

    <!-- Login Form -->
    <div id="loginForm" style="display: none;">
        <div class="container">
            <div class="login-container">
                <div class="card shadow">
                    <div class="card-header text-center">
                        <h4><i class="fas fa-church"></i> Sistema de Dízimos</h4>
                    </div>
                    <div class="card-body">
                        <form id="loginFormElement">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-sign-in-alt"></i> Entrar
                            </button>
                        </form>
                        <hr>
                        <button class="btn btn-outline-secondary w-100" onclick="showRegisterForm()">
                            <i class="fas fa-user-plus"></i> Criar Conta
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Register Form -->
    <div id="registerForm" style="display: none;">
        <div class="container">
            <div class="login-container">
                <div class="card shadow">
                    <div class="card-header text-center">
                        <h4><i class="fas fa-user-plus"></i> Criar Conta</h4>
                    </div>
                    <div class="card-body">
                        <form id="registerFormElement">
                            <div class="mb-3">
                                <label for="regNome" class="form-label">Nome Completo</label>
                                <input type="text" class="form-control" id="regNome" required>
                            </div>
                            <div class="mb-3">
                                <label for="regEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="regEmail" required>
                            </div>
                            <div class="mb-3">
                                <label for="regTelefone" class="form-label">Telefone</label>
                                <input type="tel" class="form-control" id="regTelefone">
                            </div>
                            <div class="mb-3">
                                <label for="regEndereco" class="form-label">Endereço</label>
                                <textarea class="form-control" id="regEndereco" rows="2"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="regPassword" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="regPassword" required minlength="6">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-user-plus"></i> Cadastrar
                            </button>
                        </form>
                        <hr>
                        <button class="btn btn-outline-secondary w-100" onclick="showLoginForm()">
                            <i class="fas fa-arrow-left"></i> Voltar ao Login
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
    <!-- Simple Script to Show Login -->
    <script>
        // Show login form immediately
        document.getElementById('loading').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
        
        function showRegisterForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }
        
        function showLoginForm() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        }
        
        // Simple register function
        document.getElementById('registerFormElement').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userData = {
                nome: document.getElementById('regNome').value,
                email: document.getElementById('regEmail').value,
                telefone: document.getElementById('regTelefone').value,
                endereco: document.getElementById('regEndereco').value,
                senha: document.getElementById('regPassword').value
            };
            
            try {
                const response = await fetch('http://localhost:3000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(userData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alert('Cadastro realizado com sucesso!');
                    showLoginForm();
                } else {
                    alert('Erro: ' + (data.error || 'Erro no cadastro'));
                }
            } catch (error) {
                alert('Erro de conexão: ' + error.message);
            }
        });
    </script>
</body>
</html>
