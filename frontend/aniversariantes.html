<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniversariantes - Sistema Igreja</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .birthday-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
            margin-bottom: 30px;
        }
        .birthday-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .birthday-header h1 {
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .birthday-person {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            color: white;
            display: flex;
            align-items: center;
            transition: transform 0.3s;
        }
        .birthday-person:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .birthday-icon {
            font-size: 3rem;
            margin-right: 20px;
        }
        .birthday-info h4 {
            margin: 0;
            font-size: 1.5rem;
        }
        .birthday-info p {
            margin: 5px 0 0 0;
            opacity: 0.9;
        }
        .birthday-age {
            margin-left: auto;
            font-size: 2rem;
            font-weight: bold;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 50px;
        }
        .month-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }
        .month-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .month-btn:hover, .month-btn.active {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .stat-card h3 {
            color: #667eea;
            font-size: 3rem;
            margin: 0;
        }
        .stat-card p {
            color: #666;
            margin: 10px 0 0 0;
        }
        .today-badge {
            background: #ff6b6b;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-left: 10px;
        }
        .upcoming-section {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .upcoming-section h3 {
            color: white;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg mb-4" style="background: rgba(255,255,255,0.9); border-radius: 15px;">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <i class="fas fa-church"></i> Sistema Igreja
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                <i class="fas fa-home"></i> Início
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="admin.html">
                                <i class="fas fa-cog"></i> Admin
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="aniversariantes.html">
                                <i class="fas fa-birthday-cake"></i> Aniversariantes
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Header -->
        <div class="birthday-card">
            <div class="birthday-header">
                <h1><i class="fas fa-birthday-cake"></i> Aniversariantes</h1>
                <p class="text-muted">Celebre com a família da igreja!</p>
            </div>

            <!-- Estatísticas -->
            <div class="stats-container" id="statsContainer">
                <div class="stat-card">
                    <h3 id="totalHoje">0</h3>
                    <p>Aniversariantes Hoje</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalMes">0</h3>
                    <p>Neste Mês</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalProximos">0</h3>
                    <p>Próximos 7 Dias</p>
                </div>
            </div>

            <!-- Seletor de Mês -->
            <div class="month-selector" id="monthSelector">
                <button class="month-btn" data-month="1">Janeiro</button>
                <button class="month-btn" data-month="2">Fevereiro</button>
                <button class="month-btn" data-month="3">Março</button>
                <button class="month-btn" data-month="4">Abril</button>
                <button class="month-btn" data-month="5">Maio</button>
                <button class="month-btn" data-month="6">Junho</button>
                <button class="month-btn" data-month="7">Julho</button>
                <button class="month-btn" data-month="8">Agosto</button>
                <button class="month-btn" data-month="9">Setembro</button>
                <button class="month-btn" data-month="10">Outubro</button>
                <button class="month-btn" data-month="11">Novembro</button>
                <button class="month-btn" data-month="12">Dezembro</button>
            </div>
        </div>

        <!-- Aniversariantes de Hoje -->
        <div class="upcoming-section" id="todaySection" style="display: none;">
            <h3><i class="fas fa-gift"></i> Aniversariantes de Hoje 🎉</h3>
            <div id="todayList"></div>
        </div>

        <!-- Próximos Aniversários -->
        <div class="upcoming-section" id="upcomingSection" style="display: none;">
            <h3><i class="fas fa-calendar-alt"></i> Próximos 7 Dias</h3>
            <div id="upcomingList"></div>
        </div>

        <!-- Lista de Aniversariantes do Mês -->
        <div class="birthday-card">
            <h3 class="text-center mb-4" id="monthTitle">
                <i class="fas fa-calendar"></i> Aniversariantes do Mês
            </h3>
            <div id="birthdayList">
                <div class="text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script>
        const API_URL = window.API_CONFIG?.BASE_URL || 'http://localhost:3000/api';
        let currentMonth = new Date().getMonth() + 1;

        // Carregar dados iniciais
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadTodayBirthdays();
            loadUpcomingBirthdays();
            loadMonthBirthdays(currentMonth);
            
            // Marcar mês atual como ativo
            document.querySelector(`[data-month="${currentMonth}"]`)?.classList.add('active');
        });

        // Seletor de mês
        document.querySelectorAll('.month-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const month = parseInt(btn.dataset.month);
                document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadMonthBirthdays(month);
            });
        });

        // Carregar estatísticas
        async function loadStats() {
            try {
                const token = localStorage.getItem('token');
                
                // Aniversariantes de hoje
                const todayRes = await fetch(`${API_URL}/birthdays/today`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const todayData = await todayRes.json();
                document.getElementById('totalHoje').textContent = todayData.total;

                // Aniversariantes do mês
                const monthRes = await fetch(`${API_URL}/birthdays/month/${currentMonth}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const monthData = await monthRes.json();
                document.getElementById('totalMes').textContent = monthData.total;

                // Próximos 7 dias
                const upcomingRes = await fetch(`${API_URL}/birthdays/upcoming`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const upcomingData = await upcomingRes.json();
                document.getElementById('totalProximos').textContent = upcomingData.total;

            } catch (error) {
                console.error('Erro ao carregar estatísticas:', error);
            }
        }

        // Carregar aniversariantes de hoje
        async function loadTodayBirthdays() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/birthdays/today`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (data.total > 0) {
                    document.getElementById('todaySection').style.display = 'block';
                    document.getElementById('todayList').innerHTML = data.aniversariantes.map(person => `
                        <div class="birthday-person">
                            <div class="birthday-icon">🎂</div>
                            <div class="birthday-info">
                                <h4>${person.nome} <span class="today-badge">HOJE!</span></h4>
                                <p><i class="fas fa-envelope"></i> ${person.email}</p>
                                ${person.telefone ? `<p><i class="fas fa-phone"></i> ${person.telefone}</p>` : ''}
                            </div>
                            <div class="birthday-age">${person.idade} anos</div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Erro ao carregar aniversariantes de hoje:', error);
            }
        }

        // Carregar próximos aniversários
        async function loadUpcomingBirthdays() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/birthdays/upcoming`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (data.total > 0) {
                    document.getElementById('upcomingSection').style.display = 'block';
                    document.getElementById('upcomingList').innerHTML = data.aniversariantes.map(person => {
                        const diasTexto = person.dias_restantes === 0 ? 'Hoje!' : 
                                         person.dias_restantes === 1 ? 'Amanhã' : 
                                         `Em ${person.dias_restantes} dias`;
                        
                        return `
                            <div class="birthday-person">
                                <div class="birthday-icon">🎈</div>
                                <div class="birthday-info">
                                    <h4>${person.nome}</h4>
                                    <p><i class="fas fa-calendar"></i> ${person.dia}/${person.mes} - ${diasTexto}</p>
                                    <p><i class="fas fa-envelope"></i> ${person.email}</p>
                                </div>
                                <div class="birthday-age">${person.idade} anos</div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (error) {
                console.error('Erro ao carregar próximos aniversários:', error);
            }
        }

        // Carregar aniversariantes do mês
        async function loadMonthBirthdays(month) {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_URL}/birthdays/month/${month}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                const meses = [
                    'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                    'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
                ];

                document.getElementById('monthTitle').innerHTML = 
                    `<i class="fas fa-calendar"></i> Aniversariantes de ${meses[month - 1]}`;

                const listContainer = document.getElementById('birthdayList');

                if (data.total === 0) {
                    listContainer.innerHTML = `
                        <div class="text-center text-muted">
                            <i class="fas fa-calendar-times fa-3x mb-3"></i>
                            <p>Nenhum aniversariante em ${meses[month - 1]}</p>
                        </div>
                    `;
                    return;
                }

                listContainer.innerHTML = data.aniversariantes.map(person => `
                    <div class="birthday-person">
                        <div class="birthday-icon">🎉</div>
                        <div class="birthday-info">
                            <h4>${person.nome}</h4>
                            <p><i class="fas fa-calendar"></i> ${person.dia}/${month}</p>
                            <p><i class="fas fa-envelope"></i> ${person.email}</p>
                            ${person.telefone ? `<p><i class="fas fa-phone"></i> ${person.telefone}</p>` : ''}
                        </div>
                        <div class="birthday-age">${person.idade} anos</div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Erro ao carregar aniversariantes:', error);
                document.getElementById('birthdayList').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle"></i>
                        Erro ao carregar aniversariantes. Tente novamente.
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
