<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Acesso ao Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 50px; background: #f0f0f0; }
        .test-card { background: white; border-radius: 10px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">🔍 Teste de Acesso ao Sistema</h1>
        
        <div class="test-card">
            <h3>Status do Sistema</h3>
            <div id="status">Testando...</div>
        </div>

        <div class="test-card">
            <h3>Links Diretos</h3>
            <div class="list-group">
                <a href="http://localhost:3000" class="list-group-item list-group-item-action" target="_blank">
                    🏠 Página Principal (Login)
                </a>
                <a href="http://localhost:3000/admin.html" class="list-group-item list-group-item-action" target="_blank">
                    ⚙️ Painel Admin
                </a>
                <a href="http://localhost:3000/relatorio-visual.html" class="list-group-item list-group-item-action" target="_blank">
                    📊 Relatório Completo (Carrega automaticamente)
                </a>
            </div>
        </div>

        <div class="test-card">
            <h3>Credenciais de Acesso</h3>
            <table class="table">
                <tr>
                    <td><strong>Email:</strong></td>
                    <td>
                        <code>alessandro_feitosa21@hotmail.com</code>
                        <button class="btn btn-sm btn-outline-primary" onclick="copyText('alessandro_feitosa21@hotmail.com')">Copiar</button>
                    </td>
                </tr>
                <tr>
                    <td><strong>Senha:</strong></td>
                    <td>
                        <code>123456</code>
                        <button class="btn btn-sm btn-outline-primary" onclick="copyText('123456')">Copiar</button>
                    </td>
                </tr>
                <tr>
                    <td><strong>Tipo:</strong></td>
                    <td><span class="badge bg-success">ADMIN</span></td>
                </tr>
            </table>
        </div>

        <div class="test-card">
            <h3>Teste Automático de Login</h3>
            <button class="btn btn-primary" onclick="testarLogin()">Testar Login Agora</button>
            <div id="loginResult" class="mt-3"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:3000/api';

        // Testar servidor
        async function testarServidor() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                document.getElementById('status').innerHTML = `
                    <p class="success">✅ Servidor ONLINE</p>
                    <p class="info">Tempo ativo: ${Math.floor(data.uptime)} segundos</p>
                `;
            } catch (error) {
                document.getElementById('status').innerHTML = `
                    <p class="error">❌ Servidor OFFLINE</p>
                    <p>Erro: ${error.message}</p>
                `;
            }
        }

        // Testar login
        async function testarLogin() {
            const resultDiv = document.getElementById('loginResult');
            resultDiv.innerHTML = '<p>Testando login...</p>';
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'alessandro_feitosa21@hotmail.com',
                        senha: '123456'
                    })
                });
                
                const data = await response.json();
                
                if (data.token) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            <h5>✅ Login Bem-Sucedido!</h5>
                            <p><strong>Nome:</strong> ${data.user.nome}</p>
                            <p><strong>Email:</strong> ${data.user.email}</p>
                            <p><strong>Tipo:</strong> <span class="badge bg-info">${data.user.tipo_usuario}</span></p>
                            <p><strong>Token:</strong> ${data.token.substring(0, 30)}...</p>
                            <hr>
                            <p class="mb-0">Agora você pode acessar qualquer link acima!</p>
                        </div>
                    `;
                    
                    // Salvar token
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-danger">
                            ❌ Erro no login: ${data.error || 'Desconhecido'}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        ❌ Erro: ${error.message}
                    </div>
                `;
            }
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            alert('Copiado: ' + text);
        }

        // Executar ao carregar
        testarServidor();
    </script>
</body>
</html>
