<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Formas Pagamento</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            padding: 20px;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .payment-method {
            border: 3px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }
        .payment-method:hover {
            border-color: #007bff;
            background: #f0f8ff;
        }
        .payment-method.selected {
            border-color: #28a745;
            background: #f0fff0;
        }
        .payment-method.selected::after {
            content: " ✓ SELECIONADO";
            color: #28a745;
            font-weight: bold;
            float: right;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="card">
            <div class="card-header">
                <h4>🧪 Teste das Formas de Pagamento</h4>
            </div>
            <div class="card-body">
                
                <!-- Login rápido -->
                <div class="alert alert-info">
                    <button class="btn btn-primary btn-sm" onclick="loginRapido()">Login Rápido</button>
                    <span id="loginStatus">Não logado</span>
                </div>

                <form id="testForm">
                    <!-- Valor -->
                    <div class="mb-3">
                        <label class="form-label">Valor (R$)</label>
                        <input type="number" class="form-control" id="valor" value="50" step="0.01" required>
                    </div>

                    <!-- Tipo -->
                    <div class="mb-3">
                        <label class="form-label">Tipo</label>
                        <select class="form-select" id="tipo" required>
                            <option value="dizimo">Dízimo</option>
                            <option value="oferta">Oferta</option>
                            <option value="campanha">Campanha</option>
                        </select>
                    </div>

                    <!-- Formas de Pagamento -->
                    <div class="mb-3">
                        <label class="form-label">Forma de Pagamento</label>
                        <div class="payment-methods">
                            
                            <div class="payment-method" onclick="selecionarMetodo('pix')">
                                <i class="fas fa-qrcode"></i> 
                                <strong>PIX</strong> - Pagamento instantâneo
                            </div>

                            <div class="payment-method" onclick="selecionarMetodo('dinheiro')">
                                <i class="fas fa-money-bill-wave"></i> 
                                <strong>Dinheiro</strong> - Pagamento presencial
                            </div>

                            <div class="payment-method" onclick="selecionarMetodo('cartao')">
                                <i class="fas fa-credit-card"></i> 
                                <strong>Cartão</strong> - Débito/Crédito
                            </div>

                            <div class="payment-method" onclick="selecionarMetodo('transferencia')">
                                <i class="fas fa-university"></i> 
                                <strong>Transferência</strong> - TED/DOC
                            </div>
                        </div>
                        <input type="hidden" id="metodoPagamento" name="metodoPagamento" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100 btn-lg">
                        💰 Testar Pagamento
                    </button>
                </form>

                <div id="resultado" class="alert mt-3" style="display: none;"></div>
                
                <!-- Debug Info -->
                <div class="mt-4">
                    <h6>🔍 Debug Info:</h6>
                    <div id="debugInfo" class="bg-light p-2 rounded">
                        <small id="debugText">Selecione uma forma de pagamento...</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://192.168.4.12:3000/api';
        let authToken = null;

        async function loginRapido() {
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'joao@teste.com',
                        senha: '123456'
                    })
                });
                
                const data = await response.json();
                if (response.ok) {
                    authToken = data.token;
                    document.getElementById('loginStatus').innerHTML = `<span class="text-success">✅ Logado: ${data.user.nome}</span>`;
                } else {
                    document.getElementById('loginStatus').innerHTML = `<span class="text-danger">❌ Erro: ${data.error}</span>`;
                }
            } catch (error) {
                document.getElementById('loginStatus').innerHTML = `<span class="text-danger">❌ Erro: ${error.message}</span>`;
            }
        }

        function selecionarMetodo(metodo) {
            // Remove seleção anterior
            document.querySelectorAll('.payment-method').forEach(pm => {
                pm.classList.remove('selected');
            });

            // Adiciona seleção ao método clicado
            event.currentTarget.classList.add('selected');
            
            // Define o valor no campo hidden
            document.getElementById('metodoPagamento').value = metodo;
            
            // Update debug
            document.getElementById('debugText').innerHTML = `
                <strong>Método selecionado:</strong> ${metodo}<br>
                <strong>Valor no input:</strong> ${document.getElementById('metodoPagamento').value}<br>
                <strong>Elemento selecionado:</strong> ${event.currentTarget.innerHTML.split(' ')[1]}
            `;
        }

        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!authToken) {
                mostrarResultado('❌ Faça login primeiro!', 'danger');
                return;
            }

            const valor = parseFloat(document.getElementById('valor').value);
            const tipo = document.getElementById('tipo').value;
            const metodo = document.getElementById('metodoPagamento').value;

            // Validação detalhada
            console.log('Dados do formulário:', { valor, tipo, metodo });

            if (!metodo) {
                mostrarResultado('❌ Selecione uma forma de pagamento!', 'danger');
                return;
            }

            mostrarResultado('🔄 Enviando pagamento...', 'info');

            try {
                const dadosEnvio = {
                    valor: valor,
                    tipo: tipo,
                    metodo_pagamento: metodo,
                    observacoes: `Teste de pagamento via ${metodo}`,
                    data_doacao: new Date().toISOString().split('T')[0]
                };

                console.log('Dados enviados:', dadosEnvio);

                const response = await fetch(`${API_BASE}/donations`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(dadosEnvio)
                });

                const data = await response.json();
                console.log('Resposta:', data);

                if (response.ok) {
                    mostrarResultado(`✅ SUCESSO! Pagamento registrado!<br>
                        ID: ${data.id}<br>
                        Valor: R$ ${valor.toFixed(2)}<br>
                        Método: ${metodo}`, 'success');
                } else {
                    mostrarResultado(`❌ ERRO: ${data.error || JSON.stringify(data)}`, 'danger');
                }

            } catch (error) {
                console.error('Erro:', error);
                mostrarResultado(`❌ ERRO DE CONEXÃO: ${error.message}`, 'danger');
            }
        });

        function mostrarResultado(mensagem, tipo) {
            const div = document.getElementById('resultado');
            div.className = `alert alert-${tipo}`;
            div.innerHTML = mensagem;
            div.style.display = 'block';
        }

        // Login automático ao carregar
        window.addEventListener('load', loginRapido);
    </script>
</body>
</html>
